# 跨端构建 + 打包 CI(macOS 本机 + Windows MSVC)。
# 目的:① 保同一份源码两平台都能编(尤其 SystemAudioSource_win.cpp 的 WASAPI 在 MSVC 下能过)
#       ② 每次 push 出一份可分发产物(dmg / exe+Qt DLL)
# 触发:push / PR / 手动。tag(v*) 额外出 GitHub Release 草稿(挂 dmg + windows zip)。
# Qt 安装:直接 aqtinstall(install-qt-action 锁的 aqtinstall 3.3.0 有 XML 解析 bug,
# 装不了 Windows 包;mac 侧 Qt 6.8.2 的 QtMultimedia 还引用已移除的 AGL framework,故升 6.11)。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (aqtinstall 6.11.1)
        run: |
          python3 -m pip install --break-system-packages --quiet aqtinstall
          # Qt 镜像偶发 7z 下载损坏 → 重试 3 次
          for i in 1 2 3; do
            aqt install-qt mac desktop 6.11.1 clang_64 --outputdir "$HOME/Qt" -m qtmultimedia qtwebsockets \
              && break || { echo "aqt 失败(第 $i 次),重试…"; sleep 10; }
          done
          test -d "$HOME/Qt/6.11.1/macos/lib/cmake/Qt6"
      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/macos"   # 在 shell 展开 $HOME(env: 块不展开)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Regression(16 表情档脸 + 分析器冒烟)
        run: |
          bash scripts/dump-faces.sh
          cmake --build build --target analyze -j
      - name: Package(.dmg)
        run: bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPet-macOS
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (aqtinstall 6.8.2)
        shell: pwsh
        run: |
          python -m pip install --break-system-packages --quiet aqtinstall
          # Qt 镜像偶发 7z 下载损坏 → 重试 3 次
          for ($i = 1; $i -le 3; $i++) {
            aqt install-qt windows desktop 6.8.2 win64_msvc2022_64 --outputdir D:\Qt -m qtmultimedia qtwebsockets
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "aqt 失败(第 $i 次),重试…"
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path "D:\Qt\6.8.2\msvc2022_64\lib\cmake\Qt6")) { exit 1 }
      - name: Configure
        shell: pwsh
        env:
          CMAKE_PREFIX_PATH: D:\Qt\6.8.2\msvc2022_64
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build(WASAPI loopback 在此编过)
        shell: pwsh
        run: cmake --build build --config Release -j
      - name: Deploy(windeployqt 打 Qt DLL)
        shell: pwsh
        run: |
          & "D:\Qt\6.8.2\msvc2022_64\bin\windeployqt.exe" --release --no-translations build\Release\pixel-pet.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPet-Windows
          path: build/Release/

  # tag(v*) → 收集两平台产物 → GitHub Release 草稿(附件:dmg + windows zip)
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GITHUB_TOKEN 默认只读,建 Release 需写 contents
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixelPet-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: PixelPet-Windows
          path: artifacts/windows
      - name: Zip Windows(整个 Release 目录可分发)
        run: |
          cd artifacts/windows && zip -r ../PixelPet-Windows.zip . && cd ../..
          ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/macos/**/*.dmg
            artifacts/PixelPet-Windows.zip
